<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stretto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Prevent iOS auto-zoom when focusing form elements */
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        select,
        textarea {
            font-size: 16px !important;
        }

        .tab-active {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
            font-weight: 600;
        }
        .dark .tab-active {
            color: #818cf8;
            border-bottom-color: #818cf8;
        }
        
        .drawer-slide-up {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .diary-card {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
        }
        .diary-card:hover {
            box-shadow: 0 8px 25px -3px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-stone-50 dark:bg-zinc-900 text-stone-800 dark:text-zinc-100 font-sans min-h-screen pb-20 md:pb-6 transition-colors duration-200">

    <header class="sticky top-0 z-30 bg-stone-50/90 dark:bg-zinc-900/90 backdrop-blur-md border-b border-stone-200 dark:border-zinc-800 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button id="backBtn" onclick="showView('overview')" class="hidden p-2 rounded-full hover:bg-stone-200 dark:hover:bg-zinc-800 text-stone-600 dark:text-zinc-300">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h1 id="headerTitle" class="font-serif font-semibold text-xl text-stone-900 dark:text-white tracking-tight">Stretto</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="p-2 rounded-full text-stone-600 dark:text-zinc-300 hover:bg-stone-200 dark:hover:bg-zinc-800 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- VIEW 1: OVERVIEW DASHBOARD -->
        <section id="view-overview" class="space-y-6">
            <div class="flex justify-between items-end pt-2">
                <div>
                    <p class="text-xs font-semibold tracking-wider text-stone-400 dark:text-zinc-500 uppercase" id="currentDateText">Today</p>
                    <h2 class="text-2xl font-serif font-bold text-stone-800 dark:text-zinc-100">My Collections</h2>
                </div>
                <button onclick="openPlanModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3.5 py-2.5 rounded-xl shadow-sm flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-plus text-xs"></i> New Plan
                </button>
            </div>

            <!-- Grand Budget Card (Default ₱) -->
            <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 text-white rounded-2xl p-5 shadow-md relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 w-28 h-28 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                <p class="text-xs text-indigo-100 uppercase tracking-wider font-medium">Total Planned Budget</p>
                <div class="flex items-baseline gap-2 mt-1">
                    <span id="totalGlobalBudget" class="text-3xl font-bold font-serif">₱0.00</span>
                </div>
                <div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center text-xs text-indigo-100">
                    <span id="activePlansCount"><i class="fa-solid fa-calendar-check mr-1"></i> 0 Active Plans</span>
                    <span id="completionOverallRate"><i class="fa-solid fa-list-check mr-1"></i> 0% Done</span>
                </div>
            </div>

            <!-- Search -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400 dark:text-zinc-500 text-sm"></i>
                <input type="text" id="planSearchInput" oninput="renderPlansList()" placeholder="Search itineraries or places..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-white dark:bg-zinc-800 border border-stone-200 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 dark:text-white placeholder-stone-400 dark:placeholder-zinc-500">
            </div>

            <!-- Plans List Section -->
            <div class="space-y-3">
                <h3 class="text-xs font-semibold text-stone-500 dark:text-zinc-400 uppercase tracking-wider">Upcoming & Saved Plans</h3>
                <div id="plansList" class="space-y-3">
                    <!-- Dynamic Plan Cards Inject Here -->
                </div>
            </div>
        </section>


        <!-- VIEW 2: PLAN DETAILS VIEW -->
        <section id="view-details" class="hidden space-y-4">
            
            <!-- Banner / Header Card -->
            <div class="bg-white dark:bg-zinc-800 rounded-2xl p-4 border border-stone-200 dark:border-zinc-700 diary-card relative">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="planCategoryBadge" class="inline-block px-2.5 py-0.5 text-[10px] uppercase tracking-wider font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 rounded-full mb-1">
                            Travel
                        </span>
                        <h2 id="planDetailTitle" class="text-xl font-serif font-bold text-stone-900 dark:text-white">--</h2>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="editCurrentPlan()" class="p-2 text-stone-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                            <i class="fa-regular fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteCurrentPlan()" class="p-2 text-stone-400 hover:text-red-500 transition">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                </div>

                <div class="mt-2 text-xs text-stone-500 dark:text-zinc-400 space-y-1">
                    <p class="flex items-center gap-2">
                        <i class="fa-regular fa-calendar text-indigo-500"></i>
                        <span id="planDetailDates">--</span>
                    </p>
                    <p id="planDetailLocationContainer" class="flex items-center gap-2">
                        <i class="fa-solid fa-location-dot text-indigo-500"></i>
                        <span id="planDetailLocation">--</span>
                    </p>
                </div>

                <!-- Progress Bar -->
                <div class="mt-4 pt-3 border-t border-stone-100 dark:border-zinc-700/60">
                    <div class="flex justify-between text-xs text-stone-500 dark:text-zinc-400 mb-1 font-medium">
                        <span>Completion Progress</span>
                        <span id="planProgressPercent">0%</span>
                    </div>
                    <div class="w-full bg-stone-100 dark:bg-zinc-700 rounded-full h-2 overflow-hidden">
                        <div id="planProgressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- Tab Navigation Bar -->
            <div class="flex border-b border-stone-200 dark:border-zinc-800 text-xs text-stone-500 dark:text-zinc-400 justify-between font-medium">
                <button onclick="switchPlanTab('itinerary')" id="tab-itinerary" class="py-2.5 px-3 tab-active flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ul"></i> Itinerary
                </button>
                <button onclick="switchPlanTab('budget')" id="tab-budget" class="py-2.5 px-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-wallet"></i> Budget
                </button>
                <button onclick="switchPlanTab('companions')" id="tab-companions" class="py-2.5 px-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-users"></i> Companions
                </button>
                <button onclick="switchPlanTab('notes')" id="tab-notes" class="py-2.5 px-3 flex items-center gap-1.5">
                    <i class="fa-regular fa-sticky-note"></i> Notes
                </button>
            </div>

            <!-- TAB 1: ITINERARY -->
            <div id="content-itinerary" class="space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold uppercase tracking-wider text-stone-400 dark:text-zinc-500">Timeline & Days</span>
                    <button onclick="openActivityModal()" class="text-xs bg-stone-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-3 py-1.5 rounded-lg font-medium shadow-sm hover:opacity-90 flex items-center gap-1">
                        <i class="fa-solid fa-plus text-[10px]"></i> Add Activity
                    </button>
                </div>

                <!-- Days Filter Selector Carousel -->
                <div id="daysCarousel" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
                    <!-- Dynamic Day Filter Tabs -->
                </div>

                <!-- Daily Activities Timeline -->
                <div id="itineraryTimeline" class="space-y-3 relative pl-2 border-l-2 border-stone-200 dark:border-zinc-800 ml-2 mt-4">
                    <!-- Dynamic Timeline Items -->
                </div>
            </div>

            <!-- TAB 2: BUDGET & COSTS -->
            <div id="content-budget" class="hidden space-y-4">
                <div class="bg-stone-100 dark:bg-zinc-800/60 p-4 rounded-xl border border-stone-200 dark:border-zinc-700/60 space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-stone-500 dark:text-zinc-400 uppercase tracking-wider">Estimated Total</span>
                        <span id="planBudgetTotal" class="text-xl font-bold font-serif text-indigo-600 dark:text-indigo-400">₱0.00</span>
                    </div>
                </div>

                <div class="space-y-2">
                    <h4 class="text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider">Cost Breakdown by Activity</h4>
                    <div id="budgetBreakdownList" class="space-y-2">
                        <!-- Dynamic Costs List -->
                    </div>
                </div>
            </div>

            <!-- TAB 3: COMPANIONS -->
            <div id="content-companions" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h4 class="text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider">People Joining</h4>
                    <button onclick="openCompanionPrompt()" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-medium shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-user-plus text-[10px]"></i> Add Companion
                    </button>
                </div>

                <div id="companionsList" class="grid grid-cols-1 gap-2">
                    <!-- Dynamic Companion Cards -->
                </div>
            </div>

            <!-- TAB 4: NOTES & REMINDERS -->
            <div id="content-notes" class="hidden space-y-3">
                <div class="bg-white dark:bg-zinc-800 p-4 rounded-xl border border-stone-200 dark:border-zinc-700">
                    <label class="block text-xs font-semibold text-stone-400 dark:text-zinc-500 uppercase tracking-wider mb-2">Diary Notes & Travel Details</label>
                    <textarea id="planNotesTextarea" onchange="savePlanNotes()" rows="8" placeholder="Type travel details, packing lists, reservation info, or journal notes..." class="w-full bg-transparent border-0 focus:ring-0 text-stone-800 dark:text-zinc-100 placeholder-stone-400 dark:placeholder-zinc-500 resize-none p-0 focus:outline-none"></textarea>
                </div>
                <p class="text-[11px] text-stone-400 dark:text-zinc-500 text-right"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Auto-saves when modified</p>
            </div>

        </section>
    </main>


    <div id="planModal" class="fixed inset-0 bg-black/50 z-50 opacity-0 pointer-events-none transition-opacity duration-200 flex items-end justify-center sm:items-center">
        <div class="bg-white dark:bg-zinc-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl transform translate-y-full drawer-slide-up max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-3 border-b border-stone-200 dark:border-zinc-700">
                <h3 id="planModalTitle" class="font-serif font-bold text-lg text-stone-900 dark:text-white">Create New Plan</h3>
                <button onclick="closePlanModal()" class="text-stone-400 hover:text-stone-600 dark:hover:text-zinc-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="planForm" onsubmit="handlePlanSubmit(event)" class="mt-4 space-y-4">
                <input type="hidden" id="planId">

                <div>
                    <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Plan Title *</label>
                    <input type="text" id="inputPlanTitle" required placeholder="e.g. Boracay Weekend Getaway" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Flexible non-overlapping dates container -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Start Date *</label>
                        <input type="date" id="inputStartDate" required class="w-full px-3 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 box-border">
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">End Date *</label>
                        <input type="date" id="inputEndDate" required class="w-full px-3 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 box-border">
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-grow">
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Location / Destination</label>
                        <input type="text" id="inputLocation" placeholder="e.g. Malay, Aklan" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="w-full sm:w-32">
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Currency</label>
                        <select id="inputCurrency" class="w-full px-3 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="₱" selected>PHP (₱)</option>
                            <option value="$">USD ($)</option>
                            <option value="€">EUR (€)</option>
                            <option value="£">GBP (£)</option>
                            <option value="¥">JPY (¥)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Category</label>
                    <div class="flex gap-2">
                        <label class="flex-1 text-center py-2 text-xs border rounded-xl cursor-pointer has-[:checked]:bg-indigo-600 has-[:checked]:text-white dark:border-zinc-700">
                            <input type="radio" name="category" value="Travel" checked class="hidden"> Travel
                        </label>
                        <label class="flex-1 text-center py-2 text-xs border rounded-xl cursor-pointer has-[:checked]:bg-indigo-600 has-[:checked]:text-white dark:border-zinc-700">
                            <input type="radio" name="category" value="Event" class="hidden"> Event
                        </label>
                        <label class="flex-1 text-center py-2 text-xs border rounded-xl cursor-pointer has-[:checked]:bg-indigo-600 has-[:checked]:text-white dark:border-zinc-700">
                            <input type="radio" name="category" value="Personal" class="hidden"> Personal
                        </label>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md text-sm transition">
                        Save Plan
                    </button>
                </div>
            </form>
        </div>
    </div>


    <div id="activityModal" class="fixed inset-0 bg-black/50 z-50 opacity-0 pointer-events-none transition-opacity duration-200 flex items-end justify-center sm:items-center">
        <div class="bg-white dark:bg-zinc-800 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl transform translate-y-full drawer-slide-up max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-3 border-b border-stone-200 dark:border-zinc-700">
                <h3 id="activityModalTitle" class="font-serif font-bold text-lg text-stone-900 dark:text-white">Add Activity</h3>
                <button onclick="closeActivityModal()" class="text-stone-400 hover:text-stone-600 dark:hover:text-zinc-200 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="activityForm" onsubmit="handleActivitySubmit(event)" class="mt-4 space-y-4">
                <input type="hidden" id="activityId">

                <div>
                    <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Activity Title *</label>
                    <input type="text" id="inputActivityTitle" required placeholder="e.g., Island Hopping, Dinner" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Non-overlapping Date and Time selections -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Date *</label>
                        <select id="inputActivityDate" required class="w-full px-3 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 box-border">
                            <!-- Populated with plan dates -->
                        </select>
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Time</label>
                        <input type="time" id="inputActivityTime" class="w-full px-3 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 box-border">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Location/Spot</label>
                        <input type="text" id="inputActivityLocation" placeholder="Specific venue" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Cost / Budget (₱)</label>
                        <input type="number" step="0.01" min="0" id="inputActivityCost" placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-stone-600 dark:text-zinc-400 mb-1">Notes / Reminders</label>
                    <input type="text" id="inputActivityNotes" placeholder="e.g. Bring sunblock, voucher code" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 dark:border-zinc-700 bg-stone-50 dark:bg-zinc-900 text-stone-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-md text-sm transition">
                        Save Activity
                    </button>
                </div>
            </form>
        </div>
    </div>


    <script>
        let state = {
            plans: [],
            currentPlanId: null,
            selectedDayFilter: 'ALL',
            activeTab: 'itinerary'
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            initTheme();
            updateDateDisplay();
            renderOverview();
        });

        function updateDateDisplay() {
            const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('currentDateText').innerText = new Date().toLocaleDateString('en-US', options);
        }

        /* LOCALSTORAGE PERSISTENCE */
        function saveToLocalStorage() {
            localStorage.setItem('planner_diary_plans_v2', JSON.stringify(state.plans));
        }

        function loadFromLocalStorage() {
            const data = localStorage.getItem('planner_diary_plans_v2');
            if (data) {
                try {
                    state.plans = JSON.parse(data);
                } catch (e) {
                    console.error("Failed to parse stored plans", e);
                    state.plans = [];
                }
            } else {
                // Initialize clean empty state (NO MOCK DATA)
                state.plans = [];
                saveToLocalStorage();
            }
        }

        /* THEME MANAGEMENT */
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }
        }

        /* VIEW NAVIGATION */
        function showView(viewName) {
            const overview = document.getElementById('view-overview');
            const details = document.getElementById('view-details');
            const backBtn = document.getElementById('backBtn');
            const headerTitle = document.getElementById('headerTitle');

            if (viewName === 'overview') {
                overview.classList.remove('hidden');
                details.classList.add('hidden');
                backBtn.classList.add('hidden');
                headerTitle.innerText = "Stretto";
                state.currentPlanId = null;
                renderOverview();
            } else if (viewName === 'details') {
                overview.classList.add('hidden');
                details.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                headerTitle.innerText = "Plan Details";
                renderPlanDetails();
            }
        }

        /* OVERVIEW DASHBOARD RENDER */
        function renderOverview() {
            renderPlansList();

            let grandTotal = 0;
            let totalActivities = 0;
            let completedActivities = 0;

            state.plans.forEach(plan => {
                plan.activities.forEach(act => {
                    grandTotal += (parseFloat(act.cost) || 0);
                    totalActivities++;
                    if (act.completed) completedActivities++;
                });
            });

            const overallRate = totalActivities > 0 ? Math.round((completedActivities / totalActivities) * 100) : 0;

            document.getElementById('totalGlobalBudget').innerText = `₱${grandTotal.toFixed(2)}`;
            document.getElementById('activePlansCount').innerHTML = `<i class="fa-solid fa-calendar-check mr-1"></i> ${state.plans.length} Active Plans`;
            document.getElementById('completionOverallRate').innerHTML = `<i class="fa-solid fa-list-check mr-1"></i> ${overallRate}% Done`;
        }

        function renderPlansList() {
            const plansContainer = document.getElementById('plansList');
            const query = document.getElementById('planSearchInput').value.toLowerCase();

            const filteredPlans = state.plans.filter(p => 
                p.title.toLowerCase().includes(query) || 
                (p.location && p.location.toLowerCase().includes(query))
            );

            if (filteredPlans.length === 0) {
                plansContainer.innerHTML = `
                    <div class="text-center py-10 bg-white dark:bg-zinc-800 rounded-2xl border border-dashed border-stone-200 dark:border-zinc-700">
                        <i class="fa-regular fa-folder-open text-3xl text-stone-300 dark:text-zinc-600 mb-2"></i>
                        <p class="text-xs text-stone-500 dark:text-zinc-400">No plans yet. Click "+ New Plan" to start planning!</p>
                    </div>
                `;
                return;
            }

            plansContainer.innerHTML = filteredPlans.map(plan => {
                const totalCost = plan.activities.reduce((sum, a) => sum + (parseFloat(a.cost) || 0), 0);
                const doneCount = plan.activities.filter(a => a.completed).length;
                const progress = plan.activities.length > 0 ? Math.round((doneCount / plan.activities.length) * 100) : 0;
                const currency = plan.currency || '₱';

                return `
                    <div onclick="openPlanDetails('${plan.id}')" class="bg-white dark:bg-zinc-800 p-4 rounded-2xl border border-stone-200 dark:border-zinc-700 diary-card cursor-pointer flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-stone-100 dark:bg-zinc-700 text-stone-600 dark:text-zinc-300 rounded-md">
                                    ${plan.category || 'Plan'}
                                </span>
                                <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400">
                                    ${currency}${totalCost.toFixed(2)}
                                </span>
                            </div>
                            <h4 class="font-serif font-bold text-base text-stone-800 dark:text-zinc-100">${escapeHtml(plan.title)}</h4>
                            <p class="text-xs text-stone-500 dark:text-zinc-400 mt-1 flex items-center gap-1">
                                <i class="fa-regular fa-calendar text-xs"></i> ${formatDateRange(plan.startDate, plan.endDate)}
                            </p>
                            ${plan.location ? `<p class="text-xs text-stone-400 dark:text-zinc-500 flex items-center gap-1 mt-0.5"><i class="fa-solid fa-location-dot text-xs"></i> ${escapeHtml(plan.location)}</p>` : ''}
                        </div>

                        <div class="mt-4 pt-3 border-t border-stone-100 dark:border-zinc-700/60 flex items-center justify-between text-xs text-stone-500 dark:text-zinc-400">
                            <span>${plan.activities.length} activities</span>
                            <div class="flex items-center gap-2">
                                <div class="w-16 bg-stone-100 dark:bg-zinc-700 h-1.5 rounded-full overflow-hidden">
                                    <div class="bg-indigo-600 h-1.5 rounded-full" style="width: ${progress}%"></div>
                                </div>
                                <span class="text-[10px]">${progress}%</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* PLAN DETAILS & TAB MANAGEMENT */
        function openPlanDetails(planId) {
            state.currentPlanId = planId;
            state.selectedDayFilter = 'ALL';
            showView('details');
        }

        function getCurrentPlan() {
            return state.plans.find(p => p.id === state.currentPlanId);
        }

        function renderPlanDetails() {
            const plan = getCurrentPlan();
            if (!plan) return showView('overview');

            document.getElementById('planDetailTitle').innerText = plan.title;
            document.getElementById('planDetailDates').innerText = formatDateRange(plan.startDate, plan.endDate);
            document.getElementById('planCategoryBadge').innerText = plan.category || 'Plan';
            
            const locContainer = document.getElementById('planDetailLocationContainer');
            if (plan.location) {
                locContainer.classList.remove('hidden');
                document.getElementById('planDetailLocation').innerText = plan.location;
            } else {
                locContainer.classList.add('hidden');
            }

            const totalActs = plan.activities.length;
            const doneActs = plan.activities.filter(a => a.completed).length;
            const progress = totalActs > 0 ? Math.round((doneActs / totalActs) * 100) : 0;
            document.getElementById('planProgressPercent').innerText = `${progress}%`;
            document.getElementById('planProgressBar').style.width = `${progress}%`;

            renderDaysCarousel();
            renderItineraryTimeline();
            renderBudgetTab();
            renderCompanionsTab();
            document.getElementById('planNotesTextarea').value = plan.notes || '';
        }

        function switchPlanTab(tabName) {
            state.activeTab = tabName;
            ['itinerary', 'budget', 'companions', 'notes'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const content = document.getElementById(`content-${t}`);
                if (t === tabName) {
                    btn.classList.add('tab-active');
                    content.classList.remove('hidden');
                } else {
                    btn.classList.remove('tab-active');
                    content.classList.add('hidden');
                }
            });
        }

        /* DAYS CAROUSEL FILTER */
        function renderDaysCarousel() {
            const plan = getCurrentPlan();
            const carousel = document.getElementById('daysCarousel');
            if (!plan) return;

            const dates = getDatesInRange(plan.startDate, plan.endDate);

            let html = `
                <button onclick="filterDay('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-medium border whitespace-nowrap transition ${state.selectedDayFilter === 'ALL' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-zinc-800 text-stone-600 dark:text-zinc-300 border-stone-200 dark:border-zinc-700'}">
                    All Days
                </button>
            `;

            dates.forEach((d, idx) => {
                const dayLabel = `Day ${idx + 1} (${formatShortDate(d)})`;
                const isSelected = state.selectedDayFilter === d;
                html += `
                    <button onclick="filterDay('${d}')" class="px-3 py-1.5 rounded-xl text-xs font-medium border whitespace-nowrap transition ${isSelected ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white dark:bg-zinc-800 text-stone-600 dark:text-zinc-300 border-stone-200 dark:border-zinc-700'}">
                        ${dayLabel}
                    </button>
                `;
            });

            carousel.innerHTML = html;
        }

        function filterDay(dayStr) {
            state.selectedDayFilter = dayStr;
            renderDaysCarousel();
            renderItineraryTimeline();
        }

        /* ITINERARY TIMELINE & ACTIVITIES */
        function renderItineraryTimeline() {
            const plan = getCurrentPlan();
            const timeline = document.getElementById('itineraryTimeline');
            if (!plan) return;

            let activities = [...plan.activities];
            
            if (state.selectedDayFilter !== 'ALL') {
                activities = activities.filter(a => a.date === state.selectedDayFilter);
            }

            activities.sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));

            if (activities.length === 0) {
                timeline.innerHTML = `
                    <div class="py-8 text-center text-stone-400 dark:text-zinc-500 text-xs">
                        No activities scheduled for this view. Click "+ Add Activity" above.
                    </div>
                `;
                return;
            }

            timeline.innerHTML = activities.map(act => {
                const currency = plan.currency || '₱';
                return `
                    <div class="relative pl-6 pb-2 group">
                        <div class="absolute -left-[17px] top-1.5 w-3.5 h-3.5 rounded-full border-2 border-indigo-600 bg-white dark:bg-zinc-900 flex items-center justify-center">
                            ${act.completed ? '<div class="w-1.5 h-1.5 bg-indigo-600 rounded-full"></div>' : ''}
                        </div>

                        <div class="bg-white dark:bg-zinc-800 p-3.5 rounded-xl border border-stone-200 dark:border-zinc-700 diary-card">
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-start gap-2.5">
                                    <input type="checkbox" ${act.completed ? 'checked' : ''} onchange="toggleActivityComplete('${act.id}')" class="mt-1 rounded text-indigo-600 focus:ring-indigo-500 dark:bg-zinc-900 border-stone-300 dark:border-zinc-600">
                                    <div>
                                        <h5 class="text-sm font-semibold text-stone-800 dark:text-zinc-100 ${act.completed ? 'line-through text-stone-400 dark:text-zinc-500' : ''}">
                                            ${escapeHtml(act.title)}
                                        </h5>
                                        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-stone-500 dark:text-zinc-400 mt-0.5">
                                            ${act.time ? `<span class="font-medium text-indigo-600 dark:text-indigo-400"><i class="fa-regular fa-clock text-[10px]"></i> ${act.time}</span>` : ''}
                                            <span><i class="fa-regular fa-calendar text-[10px]"></i> ${formatShortDate(act.date)}</span>
                                            ${act.location ? `<span><i class="fa-solid fa-location-dot text-[10px]"></i> ${escapeHtml(act.location)}</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-1">
                                    ${act.cost ? `<span class="text-xs font-semibold text-stone-700 dark:text-zinc-200 bg-stone-100 dark:bg-zinc-700 px-2 py-0.5 rounded-md">${currency}${parseFloat(act.cost).toFixed(2)}</span>` : ''}
                                    <button onclick="openActivityModal('${act.id}')" class="p-1.5 text-stone-400 hover:text-stone-600 dark:hover:text-zinc-200">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="deleteActivity('${act.id}')" class="p-1.5 text-stone-400 hover:text-red-500">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            </div>

                            ${act.notes ? `<p class="text-xs text-stone-500 dark:text-zinc-400 bg-stone-50 dark:bg-zinc-900/50 p-2 rounded-lg mt-2 border border-stone-100 dark:border-zinc-700/50"><i class="fa-regular fa-note-sticky mr-1"></i> ${escapeHtml(act.notes)}</p>` : ''}

                            <div class="mt-3 pt-2 border-t border-stone-100 dark:border-zinc-700/60 space-y-1.5">
                                <div class="flex justify-between items-center text-[11px] text-stone-400 dark:text-zinc-500 uppercase font-semibold">
                                    <span>Sub-tasks / Checklist</span>
                                    <button onclick="promptAddSubItem('${act.id}')" class="text-indigo-600 dark:text-indigo-400 hover:underline text-[11px] lowercase">
                                        + add sub-item
                                    </button>
                                </div>
                                ${(act.subItems || []).map(sub => `
                                    <div class="flex items-center justify-between text-xs group/sub">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" ${sub.completed ? 'checked' : ''} onchange="toggleSubItemComplete('${act.id}', '${sub.id}')" class="rounded text-indigo-600 text-xs dark:bg-zinc-900 border-stone-300 dark:border-zinc-600">
                                            <span class="${sub.completed ? 'line-through text-stone-400 dark:text-zinc-500' : 'text-stone-700 dark:text-zinc-300'}">${escapeHtml(sub.title)}</span>
                                        </label>
                                        <button onclick="deleteSubItem('${act.id}', '${sub.id}')" class="text-stone-300 hover:text-red-500 opacity-0 group-hover/sub:opacity-100 transition">
                                            <i class="fa-solid fa-xmark text-xs"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* BUDGET BREAKDOWN TAB */
        function renderBudgetTab() {
            const plan = getCurrentPlan();
            if (!plan) return;

            const currency = plan.currency || '₱';
            const breakdownList = document.getElementById('budgetBreakdownList');

            let total = 0;
            const itemsHtml = plan.activities
                .filter(a => a.cost && parseFloat(a.cost) > 0)
                .map(a => {
                    const costVal = parseFloat(a.cost);
                    total += costVal;
                    return `
                        <div class="bg-white dark:bg-zinc-800 p-3 rounded-xl border border-stone-200 dark:border-zinc-700 flex justify-between items-center">
                            <div>
                                <h6 class="text-xs font-semibold text-stone-800 dark:text-zinc-200">${escapeHtml(a.title)}</h6>
                                <p class="text-[11px] text-stone-400 dark:text-zinc-500">${formatShortDate(a.date)} ${a.time ? '• ' + a.time : ''}</p>
                            </div>
                            <span class="text-sm font-bold font-serif text-stone-900 dark:text-zinc-100">${currency}${costVal.toFixed(2)}</span>
                        </div>
                    `;
                }).join('');

            document.getElementById('planBudgetTotal').innerText = `${currency}${total.toFixed(2)}`;

            if (!itemsHtml) {
                breakdownList.innerHTML = `<p class="text-xs text-stone-400 dark:text-zinc-500 py-4 text-center">No expenses logged for activities yet.</p>`;
            } else {
                breakdownList.innerHTML = itemsHtml;
            }
        }

        /* COMPANIONS TAB */
        function renderCompanionsTab() {
            const plan = getCurrentPlan();
            if (!plan) return;

            const list = document.getElementById('companionsList');
            const companions = plan.companions || [];

            if (companions.length === 0) {
                list.innerHTML = `<p class="text-xs text-stone-400 dark:text-zinc-500 py-4 text-center">Solo plan. Click "+ Add Companion" to invite friends!</p>`;
                return;
            }

            list.innerHTML = companions.map((c, idx) => `
                <div class="bg-white dark:bg-zinc-800 p-3 rounded-xl border border-stone-200 dark:border-zinc-700 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-xs font-bold uppercase">
                            ${c.charAt(0)}
                        </div>
                        <span class="text-xs font-semibold text-stone-800 dark:text-zinc-200">${escapeHtml(c)}</span>
                    </div>
                    <button onclick="removeCompanion(${idx})" class="text-stone-400 hover:text-red-500 text-xs">
                        <i class="fa-solid fa-user-minus"></i>
                    </button>
                </div>
            `).join('');
        }

        function openCompanionPrompt() {
            const name = prompt("Enter companion's name:");
            if (name && name.trim()) {
                const plan = getCurrentPlan();
                if (!plan.companions) plan.companions = [];
                plan.companions.push(name.trim());
                saveToLocalStorage();
                renderCompanionsTab();
            }
        }

        function removeCompanion(index) {
            const plan = getCurrentPlan();
            if (plan && plan.companions) {
                plan.companions.splice(index, 1);
                saveToLocalStorage();
                renderCompanionsTab();
            }
        }

        /* NOTES UPDATE */
        function savePlanNotes() {
            const plan = getCurrentPlan();
            if (plan) {
                plan.notes = document.getElementById('planNotesTextarea').value;
                saveToLocalStorage();
            }
        }

        /* PLAN HANDLERS */
        function openPlanModal(isEdit = false) {
            const modal = document.getElementById('planModal');
            const form = document.getElementById('planForm');
            
            if (isEdit) {
                const plan = getCurrentPlan();
                document.getElementById('planModalTitle').innerText = "Edit Plan";
                document.getElementById('planId').value = plan.id;
                document.getElementById('inputPlanTitle').value = plan.title;
                document.getElementById('inputStartDate').value = plan.startDate;
                document.getElementById('inputEndDate').value = plan.endDate;
                document.getElementById('inputLocation').value = plan.location || '';
                document.getElementById('inputCurrency').value = plan.currency || '₱';
            } else {
                document.getElementById('planModalTitle').innerText = "Create New Plan";
                form.reset();
                document.getElementById('planId').value = '';
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('inputStartDate').value = today;
                document.getElementById('inputEndDate').value = today;
                document.getElementById('inputCurrency').value = '₱';
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('translate-y-full');
        }

        function closePlanModal() {
            const modal = document.getElementById('planModal');
            modal.querySelector('div').classList.add('translate-y-full');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function handlePlanSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('planId').value;
            const title = document.getElementById('inputPlanTitle').value;
            const startDate = document.getElementById('inputStartDate').value;
            const endDate = document.getElementById('inputEndDate').value;
            const location = document.getElementById('inputLocation').value;
            const currency = document.getElementById('inputCurrency').value;
            const category = document.querySelector('input[name="category"]:checked')?.value || 'Travel';

            if (id) {
                const plan = state.plans.find(p => p.id === id);
                if (plan) {
                    plan.title = title;
                    plan.startDate = startDate;
                    plan.endDate = endDate;
                    plan.location = location;
                    plan.currency = currency;
                    plan.category = category;
                }
            } else {
                const newPlan = {
                    id: 'plan-' + Date.now(),
                    title,
                    startDate,
                    endDate,
                    location,
                    currency,
                    category,
                    notes: '',
                    companions: [],
                    activities: []
                };
                state.plans.push(newPlan);
                state.currentPlanId = newPlan.id;
            }

            saveToLocalStorage();
            closePlanModal();

            if (state.currentPlanId) {
                showView('details');
            } else {
                renderOverview();
            }
        }

        function editCurrentPlan() {
            openPlanModal(true);
        }

        function deleteCurrentPlan() {
            if (confirm("Are you sure you want to delete this entire plan?")) {
                state.plans = state.plans.filter(p => p.id !== state.currentPlanId);
                saveToLocalStorage();
                showView('overview');
            }
        }

        /* ACTIVITY HANDLERS */
        function openActivityModal(activityId = null) {
            const plan = getCurrentPlan();
            if (!plan) return;

            const modal = document.getElementById('activityModal');
            const form = document.getElementById('activityForm');
            const dateSelect = document.getElementById('inputActivityDate');

            const dates = getDatesInRange(plan.startDate, plan.endDate);
            dateSelect.innerHTML = dates.map(d => `<option value="${d}">${formatShortDate(d)}</option>`).join('');

            if (activityId) {
                const act = plan.activities.find(a => a.id === activityId);
                document.getElementById('activityModalTitle').innerText = "Edit Activity";
                document.getElementById('activityId').value = act.id;
                document.getElementById('inputActivityTitle').value = act.title;
                document.getElementById('inputActivityDate').value = act.date;
                document.getElementById('inputActivityTime').value = act.time || '';
                document.getElementById('inputActivityLocation').value = act.location || '';
                document.getElementById('inputActivityCost').value = act.cost || '';
                document.getElementById('inputActivityNotes').value = act.notes || '';
            } else {
                document.getElementById('activityModalTitle').innerText = "Add Activity";
                form.reset();
                document.getElementById('activityId').value = '';
                if (state.selectedDayFilter !== 'ALL') {
                    document.getElementById('inputActivityDate').value = state.selectedDayFilter;
                }
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.remove('translate-y-full');
        }

        function closeActivityModal() {
            const modal = document.getElementById('activityModal');
            modal.querySelector('div').classList.add('translate-y-full');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function handleActivitySubmit(e) {
            e.preventDefault();
            const plan = getCurrentPlan();
            if (!plan) return;

            const id = document.getElementById('activityId').value;
            const title = document.getElementById('inputActivityTitle').value;
            const date = document.getElementById('inputActivityDate').value;
            const time = document.getElementById('inputActivityTime').value;
            const location = document.getElementById('inputActivityLocation').value;
            const cost = document.getElementById('inputActivityCost').value;
            const notes = document.getElementById('inputActivityNotes').value;

            if (id) {
                const act = plan.activities.find(a => a.id === id);
                if (act) {
                    act.title = title;
                    act.date = date;
                    act.time = time;
                    act.location = location;
                    act.cost = cost;
                    act.notes = notes;
                }
            } else {
                const newAct = {
                    id: 'act-' + Date.now(),
                    title,
                    date,
                    time,
                    location,
                    cost: cost ? parseFloat(cost) : 0,
                    notes,
                    completed: false,
                    subItems: []
                };
                plan.activities.push(newAct);
            }

            saveToLocalStorage();
            closeActivityModal();
            renderPlanDetails();
        }

        function toggleActivityComplete(actId) {
            const plan = getCurrentPlan();
            if (!plan) return;
            const act = plan.activities.find(a => a.id === actId);
            if (act) {
                act.completed = !act.completed;
                saveToLocalStorage();
                renderPlanDetails();
            }
        }

        function deleteActivity(actId) {
            const plan = getCurrentPlan();
            if (plan) {
                plan.activities = plan.activities.filter(a => a.id !== actId);
                saveToLocalStorage();
                renderPlanDetails();
            }
        }

        /* SUB-ITEM / CHECKLIST HANDLERS */
        function promptAddSubItem(actId) {
            const title = prompt("Enter sub-task or checklist item:");
            if (title && title.trim()) {
                const plan = getCurrentPlan();
                const act = plan.activities.find(a => a.id === actId);
                if (act) {
                    if (!act.subItems) act.subItems = [];
                    act.subItems.push({
                        id: 'sub-' + Date.now(),
                        title: title.trim(),
                        completed: false
                    });
                    saveToLocalStorage();
                    renderItineraryTimeline();
                }
            }
        }

        function toggleSubItemComplete(actId, subId) {
            const plan = getCurrentPlan();
            const act = plan.activities.find(a => a.id === actId);
            if (act && act.subItems) {
                const sub = act.subItems.find(s => s.id === subId);
                if (sub) {
                    sub.completed = !sub.completed;
                    saveToLocalStorage();
                    renderItineraryTimeline();
                }
            }
        }

        function deleteSubItem(actId, subId) {
            const plan = getCurrentPlan();
            const act = plan.activities.find(a => a.id === actId);
            if (act && act.subItems) {
                act.subItems = act.subItems.filter(s => s.id !== subId);
                saveToLocalStorage();
                renderItineraryTimeline();
            }
        }

        /* HELPER UTILITIES */
        function formatDateRange(startStr, endStr) {
            if (!startStr) return '';
            if (!endStr || startStr === endStr) return formatShortDate(startStr);
            return `${formatShortDate(startStr)} - ${formatShortDate(endStr)}`;
        }

        function formatShortDate(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            const date = new Date(y, m - 1, d);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getDatesInRange(startStr, endStr) {
            const dates = [];
            let curr = new Date(startStr);
            const last = new Date(endStr || startStr);

            while (curr <= last) {
                dates.push(curr.toISOString().split('T')[0]);
                curr.setDate(curr.getDate() + 1);
            }
            return dates;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
